# dsh-reference-session-collector bundle patch
#
# 通过官方 CLI 安装时 ——
#
#   dsh plugin --profile web add dsh-reference-session-collector
#
# —— 命令会把 `dsh-reference-session-collector` 追加到 bundle 栈，profile 启动时合并本补丁
# （单个 insert，插入本插件行）。
- insert:
    - id: dsh-reference-session-collector
      name: 'dsh-reference-session-collector'
